name: Test ZMK Module

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - .github/workflows/copilot-setup-steps.yml
      - .github/workflows/devcontainer.yml
      - .github/workflows/claude.yml
      - .github/workflows/codex.yml
      - .github/workflows/template-sync.yml
      - .github/workflows/web-ui.yml
      - .github/actions/zmk-env/**
      - .gitignore
      - .claude/**
      - .codex/**
      - "LICENSE"
      - "web/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - .github/workflows/copilot-setup-steps.yml
      - .github/workflows/devcontainer.yml
      - .github/workflows/claude.yml
      - .github/workflows/codex.yml
      - .github/workflows/template-sync.yml
      - .github/workflows/web-ui.yml
      - .github/actions/zmk-env/**
      - .gitignore
      - .claude/**
      - .codex/**
      - "LICENSE"
      - "web/**"
  workflow_dispatch:
  schedule:
    # 20:00 JST every Friday (11:00 UTC)
    - cron: "0 11 * * 5"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: zmkfirmware/zmk-build-arm:stable
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/west-init
      - name: Test
        run: python3 -m unittest -v
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zmk-firmware
          path: |
            build/*/zephyr/zmk.uf2

  renode-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: zmkfirmware/zmk-build-arm:stable
    name: Renode test (hardware-free)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/west-init
      # Pinned by commit SHA (immutable, works even before any PR into
      # zmk-workspace merges). Bump this SHA whenever a fix lands on
      # zmk-workspace's claude/renode-ci-action branch.
      # TODO: repoint to @main after the zmk-workspace PR merges.
      # Paths are relative to the checkout root -- do NOT use
      # ${{ github.workspace }} here: in a container job that expression
      # is the runner-host path, not the container's mount path.
      - uses: cormoran/zmk-workspace/.github/actions/zmk-renode-test@d020c124897e59559ca4d0138f414691de4e4f5f
        with:
          shield: tester_xiao
          zmk-config: tests/zmk-config/config
          module-paths: |
            .
            tests/zmk-config
          cmake-args: |
            -DCONFIG_ZMK_STUDIO=y
            -DCONFIG_ZMK_TEMPLATE_FEATURE=y
            -DCONFIG_ZMK_TEMPLATE_FEATURE_STUDIO_RPC=y
          tests: tests/renode

  keepalive:
    if: github.event_name == 'schedule'
    permissions: write-all
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Re-enable workflow to avoid deactivating scheduled runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_REPO: ${{ github.repository }}
        run: |
          gh workflow enable zmk-module.yml
