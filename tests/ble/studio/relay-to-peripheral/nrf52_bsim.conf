# Shared by the split central (DUT) and the peripheral build. Enabling the
# split-relay sample feature on BOTH halves compiles the relay carrier +
# peripheral listener (src/split/template_relay.c) into each.
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_TEMPLATE_FEATURE=y
CONFIG_ZMK_TEMPLATE_FEATURE_SPLIT_RELAY=y
